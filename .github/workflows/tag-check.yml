name: Tag Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/data/blog/**'
      - 'src/data/tags.json'
      - 'src/utils/tagMeta.ts'
      - 'public/_redirects'
      - 'scripts/tag-check.mjs'
      - 'scripts/redirects-check.mjs'
  push:
    branches: [main]
    paths:
      - 'src/data/blog/**'
      - 'src/data/tags.json'
      - 'src/utils/tagMeta.ts'
      - 'public/_redirects'
      - 'scripts/tag-check.mjs'
      - 'scripts/redirects-check.mjs'

jobs:
  validate-tags:
    name: Validate Article Tags
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate tags
        run: node scripts/tag-check.mjs
      - name: Validate redirects
        if: always()
        run: node scripts/redirects-check.mjs
