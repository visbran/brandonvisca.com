services:
  tianji:
    container_name: tianji
    image: moonrailgun/tianji:1.26.1
    ports: ["12346:12345"]
    environment:
      DATABASE_URL: postgresql://tianji:tianji@db:5432/tianji
      JWT_SECRET: demo-instance-secret
      ALLOW_REGISTER: "true"
      ALLOW_OPENAPI: "true"
    depends_on:
      db:
        condition: service_healthy
  db:
    container_name: tianji-db
    image: postgres:15.4-alpine
    environment:
      POSTGRES_DB: tianji
      POSTGRES_USER: tianji
      POSTGRES_PASSWORD: tianji
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tianji -d tianji"]
      interval: 3s
      timeout: 5s
      retries: 20
