# Instance jetable pour les captures de l'article FileBrowser Quantum.
# La config est embarquée ici : le runner ne pousse que ce fichier et setup.sh.
services:
  filebrowser:
    container_name: filebrowser
    image: gtstef/filebrowser:1.5.7-stable
    ports: ["8090:80"]
    volumes:
      - ./files:/folder
      - fbq-data:/home/filebrowser/data
    configs:
      - source: fbq-config
        target: /home/filebrowser/data/config.yaml

volumes:
  fbq-data:

configs:
  fbq-config:
    content: |
      server:
        cacheDir: /home/filebrowser/data/tmp
        sources:
          - path: /folder
            name: Fichiers
            config:
              defaultEnabled: true
      auth:
        adminUsername: admin
        adminPassword: "demo-captures-2026"
